---
layout: description
---
<h1>{{ page.title }}</h1>
<small>{{ post.date | date_to_string }}</small>
{{content}}

{% if page.comments%}
<hr>
{% endif %}

<footer class="post-footer">
<nav class="post-navigation" aria-label="Post Navigation">
    <div class="nav-item nav-prev">
      {% if page.previous.url %}
        <a href="{{ page.previous.url | relative_url }}">
          &larr; Previous Post
        </a>
      {% else %}
        <span class="nav-placeholder" aria-hidden="true">&larr; Previous Post</span>
      {% endif %}
    </div>

    <div class="nav-item nav-top">
      <a href="#top" id="go-to-top">Go To Top</a>
    </div>

    <div class="nav-item nav-next">
      {% if page.next.url %}
        <a href="{{ page.next.url | relative_url }}">
          Next Post &rarr;
        </a>
      {% else %}
        <span class="nav-placeholder" aria-hidden="true">Next Post &rarr;</span>
      {% endif %}
    </div>
</nav>
</footer>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Select all images inside post body or galleries that have an alt attribute
  const images = document.querySelectorAll('main img[alt], .post-content img[alt], .image-gallery img[alt]');

  images.forEach(img => {
    const captionText = img.getAttribute('alt').trim();

    // Skip if alt attribute is empty
    if (!captionText) return;

    // Create <figure> and <figcaption> elements
    const figure = document.createElement('figure');
    figure.className = 'js-captioned-figure';

    const figcaption = document.createElement('figcaption');
    figcaption.className = 'js-captioned-text';
    figcaption.textContent = captionText;

    // Insert figure into the DOM and wrap the image
    img.parentNode.insertBefore(figure, img);
    figure.appendChild(img);
    figure.appendChild(figcaption);
  });
});
</script>
